<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <button class="new-chat-btn" id="newChatBtn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1v14M1 8h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        New chat
      </button>
    </div>
    <div class="sidebar-section-label">Recents</div>
    <nav class="chat-history" id="chatHistory">
      <!-- populated by JS -->
    </nav>
    <div class="sidebar-bottom">
      <div class="brand-mark">
        <span class="brand-dot"></span>
        Second Brain
      </div>
    </div>
  </aside>

  <!-- Main chat column -->
  <main class="main">
    <header class="topbar">
      <span class="topbar-title">Second Brain</span>
      <span class="topbar-model">RAG · Ollama</span>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="empty-state" id="emptyState">
        <h1>What are you looking for?</h1>
        <p>Ask a question and I'll search your notes, then answer using what I find.</p>
      </div>
      <div class="messages" id="messages"></div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="composerForm">
        <textarea
          id="messageInput"
          class="composer-input"
          placeholder="Ask your notes..."
          rows="1"
          autofocus
        ></textarea>
        <button type="submit" class="send-btn" id="sendBtn" disabled aria-label="Send message">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M8 3L3 8M8 3l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <div class="composer-hint">Answers are generated from your synced Obsidian vault. Verify important facts.</div>
    </div>
  </main>

</div>

<script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
